---
   - name: install prereqs
     apt:
      pkg:
       - gpg
       - unzip
       - ufw 
       - haproxy
       - certbot

   - name: create apt repo for node
     deb822_repository:
       name: nodesource
       types: deb
       uris: https://deb.nodesource.com/node_{{NODE_MAJOR}}.x/
       suites: nodistro
       components:
         - main
       signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

   - name: install packages
     apt:
       pkg:
         - nodejs
       update_cache: true

   - name: foundry group
     group: 
       name: foundry
       state: present

   - name: foundry user
     user:
       name: foundry
       group: foundry
       state: present
       create_home: true
       shell: /bin/bash

   - name: create directories
     file:
       path: /home/foundry/{{ item }}
       state: directory
       owner: foundry
       group: foundry
       recurse: true
     with_items:
       - foundryvtt
       - foundrydata
       - foundrydata/Config

   - name: options template
     template:
       src: templates/options.json.j2
       dest: /home/foundry/foundrydata/Config/options.json
       owner: foundry
       group: foundry

   - name: unarchive source to machine
     unarchive:
      src: files/foundry.zip
      dest: /home/foundry/foundryvtt
      owner: foundry
      group: foundry

   - name: service template
     template:
       src: templates/foundry.service.j2
       dest: /etc/systemd/system/foundry.service
     register: service_template
 
   - name: daemon_reload
     systemd:
       daemon_reload: true
     when: service_template is changed

   - name: start and enable service
     systemd:
       state: started
       enabled: true
       name: foundry

